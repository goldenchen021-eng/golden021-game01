<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>方块守卫战 · Cube Defense</title>
<style>
  :root{
    --ink:#14101c; --path1:#8b3fd6; --path2:#7a34c4;
    --wall1:#6fc23a; --wall2:#58a92c; --gold:#ffd54a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#1a1620;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .stage{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;max-width:100vw;overflow:hidden;
         box-shadow:0 0 60px rgba(0,0,0,.6);user-select:none;touch-action:manipulation}
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  .hud{position:absolute;left:0;right:0;top:0;padding:10px 12px;display:flex;gap:8px;align-items:center;
       font-size:15px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
  .pill{background:rgba(20,16,28,.62);border:1px solid rgba(255,255,255,.14);border-radius:999px;
        padding:5px 12px;display:flex;gap:6px;align-items:center;backdrop-filter:blur(4px)}
  .pill b{color:var(--gold);font-variant-numeric:tabular-nums}
  .wall{flex:1;min-width:80px}
  .wallbar{position:relative;height:16px;border-radius:999px;background:rgba(0,0,0,.45);
           border:1px solid rgba(255,255,255,.16);overflow:hidden}
  .wallfill{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#3ea34b,#7ede6a);
            transition:width .18s ease-out,background .2s}
  .walltxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           font-size:11px;font-weight:700;letter-spacing:.5px}

  /* ---------- 经验条 ---------- */
  .hud2{position:absolute;left:12px;right:12px;top:47px;display:flex;gap:8px;align-items:center;pointer-events:none}
  .lvpill{background:rgba(20,16,28,.62);border:1px solid rgba(255,213,74,.45);border-radius:999px;
          padding:3px 10px;color:#ffd54a;font-size:13px;font-weight:800;letter-spacing:.5px;
          text-shadow:0 2px 4px rgba(0,0,0,.6)}
  .lvpill .atk{color:#7ef0ff;font-size:11.5px;margin-left:4px}
  .pausebtn{pointer-events:auto;flex:0 0 auto;padding:2px 9px;border-radius:8px;cursor:pointer;
            background:rgba(20,16,28,.72);border:1px solid rgba(255,255,255,.22);
            color:#cfc8dd;font-size:11.5px;font-weight:700;user-select:none}
  .pausebtn:hover{background:rgba(70,60,90,.85);color:#fff}

  /* ---------- 暂停 ---------- */
  .pauseui{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
           justify-content:center;gap:8px;background:rgba(10,6,18,.74);z-index:5;cursor:pointer}
  .pauseui.on{display:flex}
  .pauseui .t{font-size:34px;font-weight:900;color:#fff;letter-spacing:8px;text-shadow:0 4px 16px #000}
  .pauseui .s{font-size:12.5px;color:#b8b0c8}
  .xpbar{flex:1;position:relative;height:14px;border-radius:999px;background:rgba(8,6,14,.78);
         border:1px solid rgba(255,255,255,.16);overflow:hidden}
  .xpfill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#4a7bff,#7ef0ff);
          transition:width .25s ease-out}
  .xptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         font-size:10.5px;font-weight:700;color:#e2ecff;letter-spacing:.5px;text-shadow:0 1px 3px #000}

  /* ---------- 升级三选一 ---------- */
  .lvup{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
        gap:10px;background:rgba(8,6,14,.88);backdrop-filter:blur(5px);z-index:6;padding:18px}
  .lvup.on{display:flex}
  .lvup .t{font-size:26px;font-weight:900;color:#7ef0ff;letter-spacing:4px;text-shadow:0 0 22px rgba(126,240,255,.6)}
  .lvup .s{font-size:13px;color:#b8b0c8}
  .cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:370px;margin-top:4px}
  .card{display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;
        border-radius:14px;padding:11px 13px;border:1px solid rgba(255,255,255,.18);
        background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
        transition:transform .12s,border-color .15s,background .15s;color:#fff}
  .card:hover{transform:translateY(-2px);background:rgba(255,255,255,.16)}
  .card:active{transform:scale(.98)}
  .card .key{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:flex;align-items:center;
             justify-content:center;font-size:13px;font-weight:800;background:rgba(255,255,255,.14)}
  .card .body{flex:1}
  .card .nm{font-size:16px;font-weight:800;letter-spacing:.5px}
  .card .nm .tag{float:right;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:999px}
  .card .ds{font-size:12.5px;color:#cfc8dd;margin-top:3px;line-height:1.35}
  .card.common{border-color:rgba(143,211,255,.45)}
  .card.common .tag{background:rgba(143,211,255,.18);color:#a9dcff}
  .card.rare{border-color:rgba(192,123,255,.6);box-shadow:0 0 18px rgba(160,90,255,.2)}
  .card.rare .tag{background:rgba(192,123,255,.22);color:#d8b0ff}
  .card.epic{border-color:rgba(255,184,74,.75);box-shadow:0 0 22px rgba(255,184,74,.28)}
  .card.epic .tag{background:rgba(255,184,74,.22);color:#ffd08a}
  .lvup .h{font-size:11.5px;color:#7c7490;margin-top:2px}

  /* ---------- 关卡总结 ---------- */
  .summary{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
           gap:9px;background:rgba(8,6,14,.90);backdrop-filter:blur(5px);z-index:7;padding:18px}
  .summary.on{display:flex}
  .summary .t{font-size:28px;font-weight:900;color:#ffd54a;letter-spacing:3px;text-shadow:0 0 22px rgba(255,213,74,.5)}
  .summary .s{font-size:12px;color:#8f87a2;letter-spacing:2px}
  .summary .stats{display:flex;gap:10px;margin:6px 0 2px}
  .summary .stat{min-width:88px;padding:8px 12px;border-radius:12px;text-align:center;
                 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
  .summary .stat span{display:block;font-size:11px;color:#9b93ad;margin-bottom:2px}
  .summary .stat b{font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
  .summary .rewt{font-size:12px;color:#8f87a2;margin-top:8px}
  .summary .gobtn{appearance:none;margin-top:10px;padding:11px 30px;border-radius:13px;cursor:pointer;
                  border:1px solid rgba(255,213,74,.6);background:linear-gradient(135deg,#ffcf4d,#f1a53c);
                  color:#2a1c05;font:800 15px/1 inherit;letter-spacing:1px;
                  box-shadow:0 8px 22px rgba(255,180,60,.32)}
  .summary .gobtn:active{transform:scale(.98)}

  /* ---------- CD 提示 ---------- */
  .cdwrap{position:absolute;right:12px;bottom:14px;width:70px;height:70px;pointer-events:none;
          transition:bottom .28s cubic-bezier(.2,.9,.3,1.2)}
  .stage.shopopen .cdwrap{bottom:104px}
  .stage.shopopen .tip{opacity:0}
  .tip{transition:opacity .2s}
  .cdwrap svg{width:100%;height:100%}
  .cdwrap .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
               color:#fff;font-size:11px;line-height:1.1;text-shadow:0 2px 4px #000}
  .cdwrap .lab b{font-size:17px;color:var(--gold)}

  .banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;opacity:0}
  .banner .t{display:inline-block;font-size:34px;font-weight:900;color:#fff;letter-spacing:2px;
             text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(255,213,74,.5)}
  .banner .s{display:block;margin-top:8px;font-size:15px;color:#ffd54a;font-weight:700;letter-spacing:1px}

  /* ---------- 商店 ---------- */
  .shop{position:absolute;left:0;right:0;bottom:0;padding:8px 10px 10px;
        background:linear-gradient(0deg,rgba(10,8,16,.94),rgba(10,8,16,.55) 78%,rgba(10,8,16,0));
        transform:translateY(115%);transition:transform .28s cubic-bezier(.2,.9,.3,1.2);pointer-events:none}
  .shop.on{transform:translateY(0);pointer-events:auto}
  .shop-title{display:flex;align-items:baseline;gap:8px;color:#fff;font-size:13px;margin-bottom:7px;justify-content:center}
  .shop-title b{color:var(--gold);font-size:19px;font-variant-numeric:tabular-nums}
  .shop-title span.hint{color:#9b93ad;font-size:11px}
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  button.up{appearance:none;border:1px solid rgba(255,255,255,.16);border-radius:11px;cursor:pointer;
            background:rgba(255,255,255,.07);color:#fff;font:600 13px/1.2 inherit;padding:7px 9px;
            text-align:left;transition:transform .1s,background .15s,border-color .15s}
  button.up:hover:not(:disabled){background:rgba(255,255,255,.15);border-color:rgba(255,213,74,.5)}
  button.up:active:not(:disabled){transform:scale(.97)}
  button.up:disabled{opacity:.38;cursor:default}
  button.up .cost{float:right;color:var(--gold);font-weight:800}
  button.up .sub{display:block;font-size:11px;color:#a9a2b8;font-weight:500;margin-top:2px}

  /* ---------- 结束 ---------- */
  .over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
        background:rgba(8,6,12,.86);backdrop-filter:blur(6px);color:#fff;gap:14px;text-align:center;padding:24px}
  .over.on{display:flex}
  .over h1{margin:0;font-size:38px;letter-spacing:2px;color:#ff6b5a}
  .over p{margin:0;color:#cfc8dd;font-size:15px}
  .over .stat{font-size:22px;color:var(--gold);font-weight:800}
  .over button{margin-top:6px;appearance:none;border:0;border-radius:14px;padding:14px 30px;cursor:pointer;
               background:linear-gradient(180deg,#ffd54a,#e8a52a);color:#231a00;font:800 17px inherit;letter-spacing:1px}
  .over button:active{transform:scale(.97)}
  .tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#8d85a0;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="pill">波次 <b id="uiWave">1</b></div>
    <div class="pill">金币 <b id="uiCoins">0</b></div>
    <div class="wall">
      <div class="wallbar"><div class="wallfill" id="uiWall"></div><div class="walltxt" id="uiWallTxt">城墙 100</div></div>
    </div>
  </div>

  <div class="hud2">
    <div class="lvpill">Lv <span id="uiLv">1</span> <span class="atk">弓 <span id="uiAtk">1</span></span></div>
    <div class="xpbar"><div class="xpfill" id="uiXpFill"></div><div class="xptxt" id="uiXpTxt">0 / 40</div></div>
    <div class="pausebtn" id="pauseBtn">暂停</div>
  </div>

  <div class="cdwrap">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="rgba(20,16,28,.55)" stroke="rgba(255,255,255,.15)" stroke-width="2"/>
      <path id="cdArc" fill="none" stroke="#ffd54a" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <div class="lab"><b id="cdTxt">就绪</b><span>穿透箭</span></div>
  </div>

  <div class="banner" id="banner"><div class="t" id="bannerT"></div><div class="s" id="bannerS"></div></div>

  <div class="shop" id="shop">
    <div class="shop-title">备战中 <b id="uiCd">8</b> 秒 <span class="hint">· 回车立即开战</span></div>
    <div class="btns">
      <button class="up" data-up="dmg">攻击力 <span class="cost" id="cDmg">60</span><span class="sub" id="sDmg">Lv0 · 28 伤害</span></button>
      <button class="up" data-up="rate">射速 <span class="cost" id="cRate">70</span><span class="sub" id="sRate">Lv0 · 2.0 发/秒</span></button>
      <button class="up" data-up="multi">多重箭 <span class="cost" id="cMulti">220</span><span class="sub" id="sMulti">Lv0 · 单发</span></button>
      <button class="up" data-up="repair">修补城墙 <span class="cost" id="cRepair">70</span><span class="sub" id="sRepair">回复 40 城墙</span></button>
    </div>
  </div>

  <div class="summary" id="summary">
    <div class="t" id="sumTitle">第 1 波 守住</div>
    <div class="s">本关战果</div>
    <div class="stats">
      <div class="stat"><span>击杀</span><b id="sumKills">0</b></div>
      <div class="stat"><span>金币</span><b id="sumCoins">+0</b></div>
      <div class="stat"><span>经验</span><b id="sumXp">+0</b></div>
    </div>
    <div class="rewt">本关奖励 · 选一张带走（示意卡，暂未生效）</div>
    <div class="cards" id="sumCards"></div>
    <button class="gobtn" id="sumGo">继续 → 备战</button>
  </div>

  <div class="pauseui" id="pauseUI">
    <div class="t">暂 停</div>
    <div class="s">按 P / Esc 或点击这里继续</div>
  </div>

  <div class="lvup" id="lvup">
    <div class="t">升 级</div>
    <div class="s">选择一项强化，继续守城</div>
    <div class="cards" id="cards"></div>
    <div class="h">按 1 / 2 / 3 也可以选择</div>
  </div>

  <div class="over" id="over">
    <h1>城墙被攻破</h1>
    <p>你守住了 <span class="stat" id="overWave">1</span> 波</p>
    <p>击杀 <span class="stat" id="overKill">0</span> 只怪物</p>
    <button id="btnRestart">再来一局</button>
  </div>

  <div class="tip">点击怪物锁定弱点 · 空格 / 右键 放穿透箭</div>
</div>

  const bg = document.createElement('canvas');

  function cubeFill(g, x, y, w, h, dx, dy, c) {
    // 正面
    g.fillStyle = c.f; g.fillRect(x, y, w, h);
    // 顶面
    g.fillStyle = c.t;
    g.beginPath();
    g.moveTo(x, y); g.lineTo(x + dx, y - dy); g.lineTo(x + w + dx, y - dy); g.lineTo(x + w, y);
    g.closePath(); g.fill();
    // 侧面
    g.fillStyle = c.s;
    g.beginPath();
    g.moveTo(x + w, y); g.lineTo(x + w + dx, y - dy); g.lineTo(x + w + dx, y + h - dy); g.lineTo(x + w, y + h);
    g.closePath(); g.fill();
  }

  function buildBackground() {
    const g = bgx;
    g.clearRect(0, 0, W, H);
    // 底图：丛林神庙遗迹
    if (BG.complete && BG.naturalWidth) g.drawImage(BG, 0, 0, W, H);
    else { g.fillStyle = '#16210f'; g.fillRect(0, 0, W, H); }

    // 走廊压暗：让怪物、护栏从繁密的背景里跳出来
    const lane = g.createLinearGradient(0, LANE_T, 0, LANE_B);
    lane.addColorStop(0, 'rgba(6,12,6,.55)');
    lane.addColorStop(.5, 'rgba(6,12,6,.28)');
    lane.addColorStop(1, 'rgba(6,12,6,.55)');
    g.fillStyle = lane; g.fillRect(0, LANE_T, W, LANE_B - LANE_T);
    // 走廊边缘暗纹（上下两条）
    g.fillStyle = 'rgba(0,0,0,.32)';
    g.fillRect(0, LANE_T - 6, W, 6);
    g.fillRect(0, LANE_B, W, 6);
    // 四周压暗，视线收在中间
    const vg = g.createRadialGradient(W * .46, (LANE_T + LANE_B) / 2, 210, W * .46, (LANE_T + LANE_B) / 2, 650);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.46)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);

    // 城门内侧（基地）—— 先铺暗色，再压石墙
    const base = g.createLinearGradient(WALL_X, 0, 0, 0);
    base.addColorStop(0, '#1a2116'); base.addColorStop(1, '#070a06');
    g.fillStyle = base;
    g.fillRect(0, GATE_Y - GATE_HALF, WALL_X + 4, GATE_HALF * 2);

    // 左侧石墙（留出城门竖口）
    const CS = 46, dx = 13, dy = 15;
    for (let y = -46; y < H; y += CS) {
      const inGate = y > GATE_Y - GATE_HALF - CS && y < GATE_Y + GATE_HALF;
      if (inGate) continue;
      for (let c = 0; c < 3; c++) {
        cubeFill(g, 4 + c * 40, y, 38, CS - 2, dy, dx,
                 c === 0 ? { f: '#93987a', t: '#b8bd9b', s: '#5f6349' }
               : c === 1 ? { f: '#7f846a', t: '#9ba181', s: '#515540' }
                         : { f: '#6b7059', t: '#868b6f', s: '#42462f' });
        if (c === 0 && y % 92 === 0) faceOn(g, 4 + 19, y + CS / 2);
      }
    }
    // 城门光
    g.fillStyle = 'rgba(255,213,74,.10)';
    g.fillRect(WALL_X - 2, GATE_Y - GATE_HALF, 6, GATE_HALF * 2);

    // 炮塔底座：贴地石台的落影（石台本体在 drawTurret 里画）
    g.fillStyle = 'rgba(14,20,12,.55)';
    g.beginPath(); g.ellipse(TURRET.x, TURRET.y + 48, 46, 15, 0, 0, TAU); g.fill();

    // 右侧渐隐（怪物从雾里出来）
    const fog = g.createLinearGradient(W, 0, W - 150, 0);
    fog.addColorStop(0, 'rgba(10,16,10,.92)'); fog.addColorStop(1, 'rgba(10,16,10,0)');
    g.fillStyle = fog; g.fillRect(W - 150, 0, 150, H);
  }

  function faceOn(g, cx, cy) {
    const e = 5.2;
    g.fillStyle = 'rgba(255,255,255,.92)';

    g.fillStyle = 'rgba(20,10,30,.9)';

    g.fillRect(cx + 7, cy - 4, 3, 3);

  let AC = null;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  window.addEventListener('pointerdown', initAudio);
  window.addEventListener('keydown', initAudio);

  function sfx(type) {
    if (!AC || AC.state !== 'running') return;
    try {
      const t = AC.currentTime;
      const o = AC.createOscillator(), gn = AC.createGain();
      o.connect(gn); gn.connect(AC.destination);
      if (type === 'shoot') { o.type = 'square'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(420, t + .07); gn.gain.setValueAtTime(.045, t); gn.gain.exponentialRampToValueAtTime(.001, t + .09); o.start(t); o.stop(t + .1); }
      else if (type === 'hit') { o.type = 'triangle'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(160, t + .06); gn.gain.setValueAtTime(.06, t); gn.gain.exponentialRampToValueAtTime(.001, t + .08); o.start(t); o.stop(t + .09); }
      else if (type === 'kill') { o.type = 'sawtooth'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(120, t + .16); gn.gain.setValueAtTime(.07, t); gn.gain.exponentialRampToValueAtTime(.001, t + .2); o.start(t); o.stop(t + .21); }
      else if (type === 'leak') { o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + .3); gn.gain.setValueAtTime(.09, t); gn.gain.exponentialRampToValueAtTime(.001, t + .34); o.start(t); o.stop(t + .35); }
      else if (type === 'buy') { o.type = 'sine'; o.frequency.setValueAtTime(660, t); o.frequency.setValueAtTime(990, t + .08); gn.gain.setValueAtTime(.06, t); gn.gain.exponentialRampToValueAtTime(.001, t + .2); o.start(t); o.stop(t + .22); }
      else if (type === 'pierce') { o.type = 'sine'; o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(220, t + .28); gn.gain.setValueAtTime(.1, t); gn.gain.exponentialRampToValueAtTime(.001, t + .3); o.start(t); o.stop(t + .32); }
    } catch (e) {}
  }

  // ============ 波次 ============
  function planWave(w) {
    // 越往后：怪更多、波次持续时间更长（不是每波一个节奏）
    // 小怪数量 = 基础数量 × 2（首领数量不跟着翻倍）
    const base = Math.min(112, 52 + Math.floor(w * 5.2) + (w >= 8 ? Math.floor(w * 1.0) : 0));
    const count = base * 2;
    // 数量翻倍后把出怪间隔压到 ~0.68，单波时长只拉长到 1.35 倍左右，不至于枯等
    const gap = Math.max(.28, .40 - w * 0.004);
    const q = [];
    for (let i = 0; i < count; i++) {
      let type = 'squid';
      const r = Math.random();
      if (w >= 3 && r < .20) type = 'fast';
      else if (w >= 4 && r > .88) type = 'tank';
      q.push({ type, t: (i + (w >= 6 && Math.random() < .22 ? .5 : 0)) * gap });
    }
    // 每关都有首领；尾数 5 的关三只首领；尾数 0 的关三只首领 + 一只大巨兽
    if (w % 10 === 0) {
      q.push({ type: 'megaboss', t: count * gap + 2.4 });
      for (let i = 0; i < 3; i++) q.push({ type: 'boss', t: count * gap + 0.7 + i * 0.9 });
    } else if (w % 5 === 0) {
      for (let i = 0; i < 3; i++) q.push({ type: 'boss', t: count * gap + 0.8 + i * 0.9 });
    } else {
      q.push({ type: 'boss', t: count * gap + 0.9 });
    }
    return q;
  }

  function hpForWave(w) { return 66 * Math.pow(1.18, w - 1); }
  function spdForWave(w) { return Math.min(74 * Math.pow(1.012, w - 1), 122); }

  function startWave() {
    S.phase = 'wave';
    S.spawnQ = planWave(S.wave);
    // 按当波升级所需反推：前期给得足（2.4 倍）好攒强化，后期收敛到 1.55 倍
    const units = S.spawnQ.reduce((a, it) => a + TYPES[it.type].xp / 10, 0) || 1;
    const xpBoost = S.wave <= 3 ? 2.4 : S.wave <= 6 ? 2.0 : S.wave <= 9 ? 1.7 : 1.55;
    S.waveXpUnit = (S.xpNeed * xpBoost) / units;
    S.waveTime = 0;
    S.prepTimer = 0;
    shop.classList.remove('on');
    stageEl.classList.remove('shopopen');
    banner(`第 ${S.wave} 波`, S.wave % 10 === 0 ? '⚠ 大巨兽 + 三首领' : S.wave % 5 === 0 ? '⚠ 三只首领来袭' : '⚠ 首领来袭');
    // 波次统计（总结页用）
    S.waveKills0 = S.kills; S.waveCoins0 = S.coins; S.waveXp = 0;
    // 每波开头护栏修一部分
    if (S.fenceHp < S.fenceMax) {
      S.fenceHp = Math.min(S.fenceMax, S.fenceHp + Math.round(S.fenceMax * .3));
      if (S.fenceHp > 0) S.fenceBroken = false;
    }
  }

  function spawn(type) {
    const T = TYPES[type], w = S.wave;
    const row = Math.floor(rand(0, 4)); // 4 行，成排推进
    const laneSpan = (LANE_B - LANE_T) - 90;
    const y = LANE_T + 45 + row * (laneSpan / 3) + rand(-14, 14);
    const hp = Math.round(hpForWave(w) * T.hp);
    S.monsters.push({
      id: ++MID, type, x: W + 60, y, size: T.size, hp, maxHp: hp,
      speed: spdForWave(w) * T.spd * S.speedMul,
      col: T.c, bounty: T.bounty, wallDmg: T.wallDmg,
      xp: Math.max(1, Math.round(S.waveXpUnit * (T.xp / 10))),
      hitT: 0, slowT: 0, wob: rand(0, TAU), dead: false
    });
  }

  // ============ 射击 ============
  function nearestTargets(n) {
    const alive = S.monsters.filter(m => !m.dead);
    if (!alive.length) return [];
    alive.sort((a, b) => a.x - b.x);   // 越靠近城墙（x 越小）越优先
    const out = [];
    for (const m of alive) {
      if (out.length >= n) break;
      if (m === S.focus) { out.unshift(m); continue; }
      out.push(m);
    }
    return out.slice(0, n).filter(Boolean);
  }

  function arrowDamage(tgt) {
    let d = S.dmg * (tgt === S.focus ? 1.5 : 1);
    if (tgt && (tgt.type === 'boss' || tgt.type === 'megaboss')) d *= S.bossMul;
    return d;
  }

  function fire(t) {
    const targets = nearestTargets(S.multi);
    if (!targets.length) return;
    t.cd = S.interval;
    for (let i = 0; i < S.multi; i++) {
      const tgt = targets[i] || targets[0];
      const ang = Math.atan2(tgt.y - t.y, tgt.x - t.x) + (i ? rand(-.02, .02) : 0);
      const crit = Math.random() < S.crit;
      S.arrows.push({
        x: t.x, y: t.y - 6,
        vx: Math.cos(ang) * 760, vy: Math.sin(ang) * 760,
        dmg: arrowDamage(tgt) * (crit ? 2 : 1), crit,
        pierce: S.pierceArrows, hits: [], life: 1.6
      });
    }
    sfx('shoot');
  }

  function pierceShot() {
    if (S.cd > 0 || S.phase !== 'wave' || S.paused) return;
    const targets = nearestTargets(1);
    if (!targets.length) return;
    const tgt = targets[0];
    const ang = Math.atan2(tgt.y - TURRET.y, tgt.x - TURRET.x);
    const len = 1500;
    const ex = TURRET.x + Math.cos(ang) * len, ey = TURRET.y + Math.sin(ang) * len;
    S.beams.push({ x1: TURRET.x, y1: TURRET.y - 8, x2: ex, y2: ey, life: .3, max: .3 });
    S.cd = S.cdMax;

    const dmg = arrowDamage(tgt) * 3.2;
    for (const m of S.monsters) {
      if (m.dead) continue;
      const px = m.x - TURRET.x, py = m.y - TURRET.y;
      const proj = px * Math.cos(ang) + py * Math.sin(ang);
      const perp = Math.abs(-px * Math.sin(ang) + py * Math.cos(ang));
      if (proj > 0 && perp < m.size * 0.62) damage(m, dmg, true, false);
    }
    addTrauma(.55); hitStop(.08); sfx('pierce');
    S.flash = .12;
  }

  // ============ 伤害 / 死亡 ============
  function damage(m, amount, big, crit, fromExplode) {
    if (m.dead) return;
    m.hp -= amount;
    m.hitT = .16;
    if (S.slowOn) m.slowT = 2;
    const col = crit ? '#ff7a5f' : big ? '#ffd54a' : '#fff';
    pop(m.x + rand(-10, 10), m.y - m.size * .55,
        (crit ? '暴击 ' : '') + Math.round(amount), col, crit ? 24 : big ? 26 : 19);
    if (m.hp <= 0) killMonster(m, fromExplode);
    else { addTrauma(big ? .3 : .12); if (big) hitStop(.05); sfx('hit'); }
  }

  function killMonster(m, fromExplode) {
    m.dead = true;
    S.kills++;
    const gain = Math.round(m.bounty * S.coinMul);
    S.coins += gain;
    burst(m.x, m.y, m.col.f, m.type === 'boss' || m.type === 'megaboss' ? 26 : 10);
    burst(m.x, m.y, m.col.t, 6);
    const big = m.type === 'boss' || m.type === 'megaboss';
    addTrauma(big ? .85 : .22);
    hitStop(big ? .12 : .03);
    pop(m.x, m.y - m.size * .7, '+' + gain, '#ffd54a', big ? 30 : 20);
    sfx('kill');
    if (S.focus === m) S.focus = null;

    // 爆裂箭：击杀后对周围溅射
    if (S.explodeOn && !fromExplode) {
      burst(m.x, m.y, '#ffb84a', 14);
      for (const o of S.monsters) {
        if (o === m || o.dead) continue;
        if (Math.hypot(o.x - m.x, o.y - m.y) < 130) damage(o, S.dmg * 1.2, true, false, true);
      }
    }

    addXP(m.xp);
  }

  // ============ 经验 / 升级三选一 ============
  function addXP(n) {
    if (S.phase === 'over') return;
    S.xp += Math.round(n * S.xpMul);
    S.waveXp += Math.round(n * S.xpMul);
    while (S.xp >= S.xpNeed) {
      S.xp -= S.xpNeed;
      S.level++;
      S.xpNeed = Math.round(S.xpNeed * 1.42);   // 每级所需经验越来越多
      S.pendingLv++;
    }
    if (S.pendingLv > 0 && !S.paused) openLvUp();
  }

  // 增加一名攻击者（最多 3 名）
  function addAttacker() {
    if (S.turrets.length >= 3 || S.turrets.length >= ATTACKER_SLOTS.length) return;
    const slot = ATTACKER_SLOTS[S.turrets.length];
    S.turrets.push({ x: slot.x, y: slot.y, cd: 0 });
    pop(slot.x, slot.y - 70, '新攻击者', '#7ef0ff', 26);
    burst(slot.x, slot.y + 6, '#ffd54a', 14);
    addTrauma(.2);
  }

  // 是否该出现"增援"卡：等级是 3 的倍数，且还没到 3 人
  function atkCardNeeded() {
    return S.turrets.length < 3 && S.level % 3 === 0;
  }

  function rollCards() {
    // 需要增援时，只随机 2 张普通强化，第三张固定是增援
    const need = atkCardNeeded() ? 2 : 3;
    const avail = PERKS.filter(p => (S.perkCount[p.id] || 0) < p.max);
    const picked = [];
    while (picked.length < need && avail.length) {
      let total = 0;
      for (const p of avail) if (!picked.includes(p)) total += p.w;
      if (total <= 0) break;
      let r = Math.random() * total, chosen = null;
      for (const p of avail) {
        if (picked.includes(p)) continue;
        r -= p.w;
        if (r <= 0) { chosen = p; break; }
      }
      if (!chosen) chosen = avail.find(p => !picked.includes(p));
      if (!chosen) break;
      picked.push(chosen);
    }
    // 增援卡插到随机位置
    if (need === 2) {
      const pos = Math.floor(Math.random() * 3);
      picked.splice(Math.min(pos, picked.length), 0, ATK_CARD);
    }
    return picked;
  }

  function openLvUp() {
    S.paused = true;
    const cards = rollCards();
    S.cardsShown = cards;
    const box = document.getElementById('cards');
    box.innerHTML = '';
    cards.forEach((p, i) => {
      const el = document.createElement('button');
      el.className = 'card ' + p.rar;
      el.innerHTML = `<div class="key">${i + 1}</div><div class="body">
        <div class="nm">${p.name}<span class="tag">${RAR_NAME[p.rar]}</span></div>
        <div class="ds">${p.desc}</div></div>`;
      el.addEventListener('click', () => choosePerk(i));
      box.appendChild(el);
    });
    lvup.classList.add('on');
    sfx('buy');
    addTrauma(.18);
  }

  function choosePerk(i) {
    const p = S.cardsShown[i];
    if (!p) return;
    document.body.dataset.lastPick = p.id;
    S.perkCount[p.id] = (S.perkCount[p.id] || 0) + 1;
    p.apply();
    // 每选一次技能，场上与后续出场的怪物都提速 5%（封顶 2.2 倍）
    if (S.speedMul < 2.2) {
      S.speedMul = Math.min(2.2, S.speedMul * 1.05);
      for (const m of S.monsters) if (!m.dead) m.speed *= 1.05;
    }
    S.pendingLv = Math.max(0, S.pendingLv - 1);
    addTrauma(.3);
    pop(WALL_X + 40, GATE_Y - 60, p.name, '#7ef0ff', 24);
    pop(WALL_X + 120, GATE_Y + 26, '怪物提速', '#ffb36b', 15);
    if (S.pendingLv > 0) { openLvUp(); }
    else { lvup.classList.remove('on'); S.paused = false; }
    syncUI();
  }

  // 怪物顶在护栏上啃：扣护栏血，荆棘则反伤
  function hitFence(m) {
    const raw = m.wallDmg * .55;
    S.fenceHp -= raw;
    S.bgHurt = .22;
    pop(m.x - 6, m.y + 10, '-' + Math.round(raw), '#ff9b6b', 17);
    if (S.fenceThorns > 0) {
      const back = raw * S.fenceThorns;
      burst(m.x + m.size * .4, m.y, '#8fe6a0', 5);
      damage(m, back, false, false);
    }
    if (S.fenceHp <= 0) {
      S.fenceHp = 0; S.fenceBroken = true;
      banner('护栏被击破', '怪物将直冲城墙');
      burst(FENCE_X, GATE_Y, '#c9a06a', 20);
      addTrauma(.5);
      sfx('leak');
    }
  }

  function leak(m) {
    S.wallHp -= m.wallDmg;
    S.bgHurt = .5;
    addTrauma(.5); hitStop(.06);
    pop(WALL_X + 16, GATE_Y - 6, '-' + m.wallDmg, '#ff6b5a', 24);
    burst(WALL_X + 10, GATE_Y + rand(-40, 40), '#6fc23a', 12);
    sfx('leak');
    if (S.focus === m) S.focus = null;
    if (S.wallHp <= 0) {
      S.wallHp = 0; gameOver();
    }
  }

  function gameOver() {
    S.phase = 'over';
    S.gameOverAt = performance.now();
    document.getElementById('overWave').textContent = S.wave;
    document.getElementById('overKill').textContent = S.kills;
    over.classList.add('on');
    shop.classList.remove('on');
    stageEl.classList.remove('shopopen');
    lvup.classList.remove('on');
    pauseUI.classList.remove('on');
    S.paused = false;
    S.manualPause = false;
    addTrauma(1); hitStop(.16);
  }

  // ============ UI ============
  const uiWave = document.getElementById('uiWave');
  const uiCoins = document.getElementById('uiCoins');
  const stageEl = document.getElementById('stage');
  const uiWall = document.getElementById('uiWall');
  const uiWallTxt = document.getElementById('uiWallTxt');
  const shop = document.getElementById('shop');
  const over = document.getElementById('over');
  const bannerEl = document.getElementById('banner');
  const bannerT = document.getElementById('bannerT');
  const bannerS = document.getElementById('bannerS');
  const cdArc = document.getElementById('cdArc');
  const cdTxt = document.getElementById('cdTxt');
  const lvup = document.getElementById('lvup');
  const pauseUI = document.getElementById('pauseUI');
  const sumEl = document.getElementById('summary');
  const sumTitle = document.getElementById('sumTitle');
  const sumKills = document.getElementById('sumKills');
  const sumCoins = document.getElementById('sumCoins');
  const sumXp = document.getElementById('sumXp');
  const sumCards = document.getElementById('sumCards');
  const uiLv = document.getElementById('uiLv');
  const uiAtk = document.getElementById('uiAtk');
  const uiXpFill = document.getElementById('uiXpFill');
  const uiXpTxt = document.getElementById('uiXpTxt');

  let bannerTimer = 0, bannerDur = 0;
  function banner(t, s, dur) {
    bannerT.textContent = t; bannerS.textContent = s || '';
    bannerDur = dur || 2.0; bannerTimer = bannerDur;
    bannerEl.style.opacity = 1;
    bannerEl.style.transform = 'scale(1)';
  }

  const dmgCost = () => Math.round(60 * Math.pow(1.4, S.upDmg));
  const rateCost = () => Math.round(70 * Math.pow(1.4, S.upRate));
  const multiCost = () => Math.round(220 * Math.pow(1.7, S.upMulti));
  const repairCost = () => 70;

  const cDmg = document.getElementById('cDmg'), sDmg = document.getElementById('sDmg');
  const cRate = document.getElementById('cRate'), sRate = document.getElementById('sRate');
  const cMulti = document.getElementById('cMulti'), sMulti = document.getElementById('sMulti');
  const cRepair = document.getElementById('cRepair'), sRepair = document.getElementById('sRepair');
  const btns = [...document.querySelectorAll('button.up')];

  function syncUI() {
    uiWave.textContent = S.phase === 'wave'
      ? `${S.wave} · 剩 ${S.spawnQ.length + S.monsters.filter(m => !m.dead).length}`
      : S.wave;
    uiCoins.textContent = S.coins;
    uiLv.textContent = S.level;
    uiAtk.textContent = S.turrets.length;
    uiXpFill.style.width = (clamp(S.xp / S.xpNeed, 0, 1) * 100) + '%';
    uiXpTxt.textContent = `${Math.round(S.xp)} / ${S.xpNeed}`;
    const pct = clamp(S.wallHp / S.wallMax, 0, 1);
    uiWall.style.width = (pct * 100) + '%';
    uiWall.style.background = pct > .55 ? 'linear-gradient(90deg,#3ea34b,#7ede6a)'
                             : pct > .25 ? 'linear-gradient(90deg,#d39a2a,#ffd54a)'
                                         : 'linear-gradient(90deg,#b83a2c,#ff7a5f)';
    uiWallTxt.textContent = '城墙 ' + Math.max(0, Math.round(S.wallHp));

    cDmg.textContent = dmgCost();
    sDmg.textContent = `Lv${S.upDmg} · ${Math.round(S.dmg)} 伤害`;
    cRate.textContent = rateCost();
    sRate.textContent = `Lv${S.upRate} · ${(1 / S.interval).toFixed(1)} 发/秒`;
    cMulti.textContent = S.upMulti >= 3 ? 'MAX' : multiCost();
    sMulti.textContent = S.upMulti === 0 ? 'Lv0 · 单发' : `Lv${S.upMulti} · ${S.multi} 发`;
    cRepair.textContent = S.wallHp >= S.wallMax ? '满' : repairCost();
    sRepair.textContent = `回复 40（${Math.round(S.wallHp)}/${S.wallMax}）`;

    for (const b of btns) {
      const k = b.dataset.up;      const cost = k === 'dmg' ? dmgCost() : k === 'rate' ? rateCost() : k === 'multi' ? multiCost() : repairCost();
      const maxed = (k === 'multi' && S.upMulti >= 3) || (k === 'repair' && S.wallHp >= S.wallMax);
      const poor = S.coins < cost;
      b.disabled = S.phase !== 'prep' || maxed || poor;
    }

    // 穿透箭冷却环
    const p = S.cd <= 0 ? 1 : 1 - S.cd / S.cdMax;
    const a0 = -Math.PI / 2;
    if (p >= 1) {
      cdArc.setAttribute('d', circlePath(50, 50, 42));
      cdArc.style.stroke = '#ffd54a';
      cdTxt.textContent = '就绪';
    } else {
      const a1 = a0 + TAU * p;
      cdArc.setAttribute('d', arcPath(50, 50, 42, a0, a1));
      cdArc.style.stroke = 'rgba(255,213,74,.55)';
      cdTxt.textContent = Math.ceil(S.cd);
    }
    // 供自动化验收读取的状态标记
    document.body.dataset.paused = (S.paused || S.manualPause) ? '1' : '0';
    document.body.dataset.mp = S.manualPause ? '1' : '0';
    document.body.dataset.pendingLv = String(S.pendingLv);
    document.body.dataset.fence = Math.round(S.fenceHp) + '/' + S.fenceMax;
  }

  function circlePath(cx, cy, r) {
    return `M ${cx - r} ${cy} A ${r} ${r} 0 1 1 ${cx + r} ${cy} A ${r} ${r} 0 1 1 ${cx - r} ${cy}`;
  }
  function arcPath(cx, cy, r, a0, a1) {
    const sx = cx + r * Math.cos(a0), sy = cy + r * Math.sin(a0);
    const ex = cx + r * Math.cos(a1), ey = cy + r * Math.sin(a1);
    return `M ${sx} ${sy} A ${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${ex} ${ey}`;
  }

  // 升级购买
  for (const b of btns) {
    b.addEventListener('click', () => {
      if (S.phase !== 'prep') return;
      const k = b.dataset.up;
      const cost = k === 'dmg' ? dmgCost() : k === 'rate' ? rateCost() : k === 'multi' ? multiCost() : repairCost();
      if (S.coins < cost) return;
      if (k === 'multi' && S.upMulti >= 3) return;
      if (k === 'repair' && S.wallHp >= S.wallMax) return;
      S.coins -= cost;
      if (k === 'dmg') { S.upDmg++; S.dmg *= 1.25; }
      else if (k === 'rate') { S.upRate++; S.interval = Math.max(.16, S.interval * .82); }
      else if (k === 'multi') { S.upMulti++; S.multi++; }
      else if (k === 'repair') { S.wallHp = Math.min(S.wallMax, S.wallHp + 40); }
      sfx('buy');
      syncUI();
    });
  }

  // ============ 输入 ============
  function toCanvas(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width * W,
      y: (ev.clientY - r.top) / r.height * H
    };
  }

  canvas.addEventListener('pointerdown', (ev) => {
    if (S.phase === 'over' || S.paused) return;
    const p = toCanvas(ev);
    // 找点击到的怪物（带一定容差，方便手机点）
    let picked = null, best = 1e9;
    for (const m of S.monsters) {
      if (m.dead) continue;
      const d = Math.hypot(p.x - m.x, p.y - m.y);
      if (d < m.size * .75 && d < best) { best = d; picked = m; }
    }
    if (picked) {
      S.focus = picked;
      pop(picked.x, picked.y - picked.size * .8, '锁定', '#7ef0ff', 18);
      addTrauma(.12);
      sfx('hit');
    }
  });

  window.addEventListener('keydown', (ev) => {
    if (S.paused) {                       // 升级选择中：只接受 1/2/3
      if (ev.key === '1' || ev.key === '2' || ev.key === '3') {
        ev.preventDefault(); choosePerk(parseInt(ev.key, 10) - 1);
      }
      return;
    }
    if (S.summaryOpen) {
      if (ev.code === 'Enter' || ev.code === 'Space') { ev.preventDefault(); closeSummary(); }
      return;
    }
    if (ev.code === 'KeyP' || ev.code === 'Escape') { ev.preventDefault(); togglePause(); return; }
    if (S.manualPause) return;
    if (ev.code === 'Space') { ev.preventDefault(); pierceShot(); }
    else if (ev.code === 'Enter') {
      if (S.phase === 'prep') startWave();
      else if (S.phase === 'over' && performance.now() - S.gameOverAt > 400) restart();
    }
    else if (ev.code === 'KeyR' && S.phase === 'over') restart();
  });
  canvas.addEventListener('contextmenu', (ev) => { ev.preventDefault(); pierceShot(); });

  // ============ 暂停 ============
  function togglePause() {
    if (S.phase === 'over' || S.paused) return;    // 升级选择中不响应
    S.manualPause = !S.manualPause;
    pauseUI.classList.toggle('on', S.manualPause);
    if (!S.manualPause && S.pendingLv > 0) openLvUp();
  }
  document.getElementById('pauseBtn').addEventListener('click', (ev) => { ev.stopPropagation(); togglePause(); });
  pauseUI.addEventListener('click', togglePause);

  // ============ 关卡总结 ============
  function showSummary() {
    const w = S.wave - 1;
    const kills = S.kills - S.waveKills0;
    const coins = S.coins - S.waveCoins0;
    sumTitle.textContent = `第 ${w} 波 守住`;
    sumKills.textContent = kills;
    sumCoins.textContent = '+' + coins;
    sumXp.textContent = '+' + Math.round(S.waveXp);
    // 三张示意奖励卡（暂时只是看效果，不真的生效）
    const rewards = [
      { nm: '金币袋',   ds: `立刻获得 ${100 + w * 10} 金币`,                  rar: 'common' },
      { nm: '经验之书', ds: `立刻获得 ${Math.round(S.xpNeed * .35)} 点经验`,   rar: 'rare' },
      { nm: '城墙补料', ds: `城墙 +${40 + w * 4}，护栏回满`,                  rar: 'epic' },
    ];
    sumCards.innerHTML = '';
    rewards.forEach((r, i) => {
      const el = document.createElement('button');
      el.className = 'card ' + r.rar;
      el.innerHTML = `<div class="key">${i + 1}</div><div class="body">
        <div class="nm">${r.nm}<span class="tag">示例</span></div>
        <div class="ds">${r.ds}</div></div>`;
      el.addEventListener('click', () => {
        [...sumCards.children].forEach(c => c.style.opacity = '.45');
        el.style.opacity = '1';
        sfx('buy');
      });
      sumCards.appendChild(el);
    });
    S.summaryOpen = true;
    sumEl.classList.add('on');
    sfx('buy');
  }

  function closeSummary() {
    if (!S.summaryOpen) return;
    S.summaryOpen = false;
    sumEl.classList.remove('on');
    S.prepTimer = 8;
    shop.classList.add('on');
    stageEl.classList.add('shopopen');
    syncUI();
  }
  document.getElementById('sumGo').addEventListener('click', closeSummary);

  function restart() {
    over.classList.remove('on');
    lvup.classList.remove('on');
    pauseUI.classList.remove('on');
    sumEl.classList.remove('on');
    reset();
    syncUI();
    shop.classList.add('on');
    stageEl.classList.add('shopopen');
  }
  document.getElementById('btnRestart').addEventListener('click', restart);

  // ============ 主循环 ============
  let last = performance.now();

  function update(rdt) {
    if (S.paused || S.manualPause || S.summaryOpen) return;   // 升级选择 / 手动暂停 / 总结页：整局冻结
    // 顿帧：用真实时间恢复，不受 timeScale 影响
    if (S.hitStop > 0) {
      S.hitStop -= rdt;
      S.timeScale = S.hitStop > 0 ? 0.18 : 1;
    } else S.timeScale = 1;
    const dt = rdt * S.timeScale;

    // 冷却走真实时间，手感更稳
    if (S.cd > 0) S.cd = Math.max(0, S.cd - rdt);
    if (S.trauma > 0) S.trauma = Math.max(0, S.trauma - 1.35 * rdt);
    if (S.flash > 0) S.flash = Math.max(0, S.flash - rdt);
    if (S.bgHurt > 0) S.bgHurt = Math.max(0, S.bgHurt - 1.8 * rdt);

    if (bannerTimer > 0) {
      bannerTimer -= rdt;
      const k = Math.min(1, bannerTimer / Math.min(.45, bannerDur));
      bannerEl.style.opacity = k;
      bannerEl.style.transform = `scale(${1 + (1 - k) * .25})`;
      if (bannerTimer <= 0) bannerEl.style.opacity = 0;
    }

    if (S.phase === 'over') { updateFX(dt); return; }

    if (S.phase === 'prep') {
      S.prepTimer -= dt;
      document.getElementById('uiCd').textContent = Math.max(0, Math.ceil(S.prepTimer));
      if (S.prepTimer <= 0) startWave();
    }

    if (S.phase === 'wave') {
      S.waveTime += dt;
      while (S.spawnQ.length && S.spawnQ[0].t <= S.waveTime) {
        spawn(S.spawnQ.shift().type);
      }

      // 怪物推进（从右往左）
      for (const m of S.monsters) {
        if (m.dead) continue;
        m.wob += dt * 3.2;
        // 进入门前区域后向门中心收拢
        if (m.x < 470) {
          const k = clamp((470 - m.x) / 160, 0, 1);
          m.y += (GATE_Y + (m.y - GATE_Y) * .25 - m.y) * k * dt * 1.6;
        }
        m.y += Math.sin(m.wob) * 3.0 * dt * 10;
        if (m.slowT > 0) m.slowT = Math.max(0, m.slowT - dt);
        const stepX = m.speed * (m.slowT > 0 ? .55 : 1) * dt;
        if (!S.fenceBroken) {
          // 防护栏还在：怪物顶在栏前啃（被反伤），栏破才继续冲
          const stopX = FENCE_X + 8 + m.size * .5;
          m.x = Math.max(stopX, m.x - stepX);
          if (m.x <= stopX + 1.5) {
            m.atkT = (m.atkT || 0) - dt;
            if (m.atkT <= 0) { m.atkT = .9; hitFence(m); }
          }
        } else {
          m.x -= stepX;
        }
        if (m.hitT > 0) m.hitT -= dt;
        if (m.x < WALL_X + 44) { m.dead = true; leak(m); }
      }

      // 开火：每个攻击者独立冷却
      for (const t of S.turrets) {
        if (t.cd > 0) t.cd -= dt;
        if (t.cd <= 0 && S.monsters.some(m => !m.dead)) fire(t);
      }

      // 清场 → 下一波
      if (!S.spawnQ.length && !S.monsters.some(m => !m.dead)) {
        const bonus = 30 + S.wave * 8;
        S.coins += bonus;
        if (S.regen > 0) {
          const before = S.wallHp;
          S.wallHp = Math.min(S.wallMax, S.wallHp + S.regen);
          if (S.wallHp > before) pop(WALL_X + 50, GATE_Y - 40, `+${Math.round(S.wallHp - before)} 城墙`, '#7ede6a', 22);
        }
        pop(WALL_X + 70, GATE_Y, `本波奖励 +${bonus}`, '#7ede6a', 26);
        banner(`第 ${S.wave} 波 守住`, `奖励 +${bonus} 金币`, 1.6);
        S.wave++;
        S.phase = 'prep';
        S.prepTimer = 0;
        shop.classList.remove('on');
        stageEl.classList.remove('shopopen');
        showSummary();          // 关卡总结页，点「继续」才进备战
        syncUI();
      }
    }

    // 箭矢
    for (const a of S.arrows) {
      a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt;
      for (const m of S.monsters) {
        if (m.dead || a.hits.indexOf(m.id) !== -1) continue;
        if (Math.hypot(a.x - m.x, a.y - m.y) < m.size * .55) {
          a.hits.push(m.id);
          damage(m, a.dmg, false, a.crit);
          if (a.pierce > 0) a.pierce--;      // 贯甲箭：还能再穿一只
          else { a.life = 0; break; }
        }
      }
      if (a.y < -40 || a.x < -40 || a.x > W + 40) a.life = 0;
    }

    // 无效怪物回收
    S.monsters = S.monsters.filter(m => !m.dead);
    S.arrows = S.arrows.filter(a => a.life > 0);
    updateFX(dt);
  }

  function updateFX(dt) {
    for (const p of S.particles) {
      p.life -= dt;
      p.vy += 520 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += dt * 6;
    }
    S.particles = S.particles.filter(p => p.life > 0);

    for (const p of S.pops) {
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy *= 0.94;
    }
    S.pops = S.pops.filter(p => p.life > 0);

    for (const b of S.beams) b.life -= dt;
    S.beams = S.beams.filter(b => b.life > 0);
  }

  // ============ 渲染 ============
  // 画贴图：flip=true 时水平镜像（让角色朝向正确的行进方向）
  function blitSprite(img, cx, topY, wid, hgt, flip) {
    if (!flip) { ctx.drawImage(img, cx - wid / 2, topY, wid, hgt); return; }
    ctx.save();
    ctx.translate(cx, 0); ctx.scale(-1, 1);
    ctx.drawImage(img, -wid / 2, topY, wid, hgt);
    ctx.restore();
  }

  function drawMonster(m) {
    const s = m.size, x = m.x, y = m.y;
    const bob = Math.sin(m.wob * 1.4) * s * .035;
    // 影子
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    ctx.beginPath(); ctx.ellipse(x + 2, y + s * .52, s * .5, s * .16, 0, 0, TAU); ctx.fill();

    const hit = m.hitT > 0 ? Math.min(1, m.hitT / .16) : 0;
    const img = ART[SPRITE_OF[m.type]];
    const hgt = s * (m.type === 'megaboss' ? 1.5 : m.type === 'boss' ? 1.55 : 1.7);
    const wid = img ? hgt * img.width / img.height : s;
    const footY = y + s * .55 + bob;       // 脚底贴地
    const topY = footY - hgt;

    if (img) {
      // 贴图本体（普通小怪镜像成朝左冲锋，boss 保持原朝向）
      blitSprite(img, x, topY, wid, hgt, m.type !== 'boss' && m.type !== 'megaboss');
      // 受击白闪：只提亮贴图不透明区域
      if (hit > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = hit * .6;
        blitSprite(img, x, topY, wid, hgt, m.type !== 'boss' && m.type !== 'megaboss');
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      // 冰霜减速状态
      if (m.slowT > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = .16 + .1 * Math.abs(Math.sin(performance.now() / 200));
        blitSprite(img, x, topY, wid, hgt, m.type !== 'boss' && m.type !== 'megaboss');
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
    } else {
      // 素材尚未解码时的占位方块
      ctx.fillStyle = m.col.f; ctx.fillRect(x - s / 2, footY - s, s, s);
      ctx.strokeStyle = 'rgba(18,10,28,.75)'; ctx.lineWidth = 3;
      ctx.strokeRect(x - s / 2, footY - s, s, s);
    }

    // 血量数字（顶在头顶）
    const hpTxt = Math.max(0, Math.ceil(m.hp));
    const hpY = topY - Math.max(10, s * .12);
    ctx.font = `800 ${Math.max(15, Math.round(s * .34))}px "Segoe UI", system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(12,8,20,.85)';
    ctx.strokeText(hpTxt, x, hpY);
    ctx.fillStyle = m.type === 'boss' ? '#ffd54a' : m.type === 'megaboss' ? '#ff7a8a' : '#ffffff';
    ctx.fillText(hpTxt, x, hpY);

    // 血条（贴在脚下）
    if (m.hp < m.maxHp) {
      const bw = Math.max(s * .7, wid * .8), bh = 5;
      const bx = x - bw / 2, by = footY + 7;
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = m.hp / m.maxHp > .5 ? '#7ede6a' : m.hp / m.maxHp > .25 ? '#ffd54a' : '#ff6b5a';
      ctx.fillRect(bx, by, bw * clamp(m.hp / m.maxHp, 0, 1), bh);
    }

    // 锁定标记
    if (S.focus === m) {
      const r = Math.max(s * .72, wid * .58) + Math.sin(performance.now() / 180) * 3;
      ctx.strokeStyle = '#7ef0ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - r - 10, y); ctx.lineTo(x - r - 2, y);
      ctx.moveTo(x + r + 2, y); ctx.lineTo(x + r + 10, y); ctx.stroke();
    }
  }

  function drawTurret() {
    const t = performance.now() / 1000;
    for (let i = 0; i < S.turrets.length; i++) {
      const tur = S.turrets[i];
      // 贴地石台
      ctx.fillStyle = '#3b3e31';
      ctx.beginPath(); ctx.ellipse(tur.x, tur.y + 46, 44, 15, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#555a45';
      ctx.beginPath(); ctx.ellipse(tur.x, tur.y + 42, 44, 14, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#6d7358';
      ctx.beginPath(); ctx.ellipse(tur.x, tur.y + 38, 40, 12, 0, 0, TAU); ctx.fill();
      // 石台呼吸光
      ctx.fillStyle = `rgba(255,213,74,${.12 + .06 * Math.sin(t * 3 + i)})`;
      ctx.beginPath(); ctx.ellipse(tur.x, tur.y + 38, 38, 11, 0, 0, TAU); ctx.fill();
      // 弓箭手（镜像成朝右，正对来袭的怪物）
      const img = ART.archer;
      if (img) {
        const hgt = 132;
        const wid = hgt * img.width / img.height;
        const footY = tur.y + 38;
        blitSprite(img, tur.x, footY - hgt, wid, hgt, true);
        // 出手时的小后坐
        if (tur.cd > S.interval - .07) {
          ctx.globalAlpha = .5;
          blitSprite(img, tur.x - 3, footY - hgt, wid, hgt, true);
          ctx.globalAlpha = 1;
        }
      } else {
        ctx.fillStyle = '#5b40a0'; ctx.fillRect(tur.x - 22, tur.y - 6, 44, 44);
      }
      // 弓手脚下的光点
      ctx.fillStyle = 'rgba(255,213,74,.9)';
      ctx.beginPath(); ctx.arc(tur.x, tur.y + 42, 5 + Math.sin(t * 4 + i) * 1.2, 0, TAU); ctx.fill();
    }
  }

  function drawFence() {
    const y0 = LANE_T + 4, y1 = LANE_B - 4, hg = y1 - y0;
    if (S.fenceBroken) {
      // 破栏残桩
      ctx.fillStyle = '#4a3a2a';
      for (let i = 0; i <= 5; i++) {
        const y = y0 + i * (hg / 5);
        ctx.fillRect(FENCE_X - 4, y - 5, 12, 10);
        ctx.fillRect(FENCE_X + 10, y - 7, 6, 14);
      }
      return;
    }
    const k = clamp(S.fenceHp / S.fenceMax, 0, 1);
    const barCol = k > .6 ? '#8bc34a' : k > .3 ? '#d9a24a' : '#d1584a';   // 血条颜色仍按血量
    // 立柱（横撑）
    ctx.fillStyle = '#6b4a2e';
    for (let i = 0; i <= 6; i++) {
      const y = y0 + i * (hg / 6);
      ctx.fillRect(FENCE_X - 24, y - 6, 52, 12);
    }
    // 竖杆（两道，木纹木色 + 暗边 + 受光）
    const rail = k > .3 ? '#a2703c' : '#8a5531';
    ctx.fillStyle = 'rgba(10,8,14,.55)';
    ctx.fillRect(FENCE_X - 16, y0, 12, hg);
    ctx.fillRect(FENCE_X + 5, y0, 12, hg);
    ctx.fillStyle = rail;
    ctx.fillRect(FENCE_X - 14, y0, 9, hg);
    ctx.fillRect(FENCE_X + 7, y0, 9, hg);
    ctx.fillStyle = '#c08a4d';
    ctx.fillRect(FENCE_X - 14, y0, 9, 6);
    ctx.fillRect(FENCE_X + 7, y0, 9, 6);
    ctx.fillStyle = 'rgba(255,235,190,.30)';
    ctx.fillRect(FENCE_X - 14, y0, 3, hg);
    ctx.fillRect(FENCE_X + 7, y0, 3, hg);
    // 护栏血条（竖着贴在栏左侧，随血量缩短）
    const bh = 208, by = GATE_Y - bh / 2;
    ctx.fillStyle = 'rgba(6,10,16,.65)'; ctx.fillRect(FENCE_X - 40, by - 2, 11, bh + 4);
    ctx.fillStyle = barCol; ctx.fillRect(FENCE_X - 38, by + bh * (1 - k), 7, bh * k);
  }

  function draw() {
    // 震屏（trauma 平方，平滑采样而非每帧随机）
    const shake = S.trauma * S.trauma;
    const tt = performance.now() / 1000;
    const ox = shake * 14 * Math.sin(tt * 17.3);
    const oy = shake * 10 * Math.sin(tt * 23.1);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(ox, oy);

    ctx.drawImage(bg, 0, 0);

    // 受击时左侧基地带红晕
    if (S.bgHurt > 0) {
      ctx.fillStyle = `rgba(255,60,50,${S.bgHurt * .35})`;
      ctx.fillRect(0, 0, WALL_X + 60, H);
    }

    // 防护栏
    drawFence();

    // 怪物按 x 排序，越靠近城墙画在越上层（近似遮挡关系）
    const drawList = S.monsters.filter(m => !m.dead).sort((a, b) => b.x - a.x);
    for (const m of drawList) drawMonster(m);

    drawTurret();

    // 箭
    for (const a of S.arrows) {
      const ax = a.x - a.vx * .028, ay = a.y - a.vy * .028;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(a.x, a.y); ctx.stroke();
      ctx.strokeStyle = 'rgba(190,160,255,.55)';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(ax - a.vx * .02, ay - a.vy * .02); ctx.lineTo(a.x, a.y); ctx.stroke();
    }

    // 穿透光束
    for (const b of S.beams) {
      const k = b.life / b.max;
      ctx.strokeStyle = `rgba(255,255,255,${.9 * k})`;
      ctx.lineWidth = 22 * k;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
      ctx.strokeStyle = `rgba(255,213,74,${.8 * k})`;
      ctx.lineWidth = 6 * k;
      ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    }

    // 粒子（方块碎片）
    for (const p of S.particles) {
      const k = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;

    // 飘字
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of S.pops) {
      const k = clamp(p.life / .75, 0, 1);
      ctx.globalAlpha = k;
      ctx.font = `800 ${p.size}px "Segoe UI", system-ui, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(12,8,20,.8)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    // 备用：波次预告中的下一波提示
    if (S.phase === 'prep') {
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.font = '600 15px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`下一波：${7 + Math.floor(S.wave * 1.8)} 只` + (S.wave % 5 === 0 ? ' + 巨兽' : ''), 620, LANE_T + 24);
    }

    ctx.restore();

    // 白闪（穿透箭/受击）
    if (S.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${S.flash * 3})`;
      ctx.fillRect(0, 0, W, H);
    }

    // 暗角
    const vg = ctx.createRadialGradient(W / 2, H / 2, H * .32, W / 2, H / 2, H * .78);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  let uiAcc = 0;
  function loop(now) {
    const rdt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(rdt);
    draw();
    uiAcc += rdt;
    if (uiAcc > 0.1) { uiAcc = 0; syncUI(); }   // UI 10Hz，别每帧重排
    requestAnimationFrame(loop);
  }

  // 启动
  reset();
  syncUI();
  shop.classList.add('on');
  stageEl.classList.add('shopopen');
  // 调试钩子（方便自动化验收）
  window.__dbg = { showSummary, closeSummary, restart, togglePause };
  window.__debug = () => ({
    phase: S.phase, wave: S.wave, coins: S.coins, wall: S.wallHp,
    kills: S.kills, monsters: S.monsters.length, upDmg: S.upDmg,
    upRate: S.upRate, upMulti: S.upMulti, dmg: Math.round(S.dmg),
    focus: S.focus ? S.focus.type : null
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
